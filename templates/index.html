<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h2>Data-Driven Customer Retention Strategy..!</h2>

    <form action="/predict" method="post">

        <!-- 🔥 TRY SAMPLE INPUT BUTTON -->
        <button type="button" class="sample-btn" onclick="fillSampleData()">
            Try Sample Input
        </button>

        <label>Tenure (months)</label>
        <input type="number" name="tenure" required>

        <label>Monthly Charges</label>
        <input type="number" step="0.01" name="MonthlyCharges" required>

        <label>Total Charges</label>
        <input type="number" step="0.01" name="TotalCharges" required>

        <label>Contract</label>
        <select name="Contract">
            <option value="0">Month-to-month</option>
            <option value="1">One Year</option>
            <option value="2">Two Year</option>
        </select>

        <label>Payment Method</label>
        <select name="PaymentMethod">
            <option value="0">Electronic Check</option>
            <option value="1">Mailed Check</option>
            <option value="2">Bank Transfer</option>
            <option value="3">Credit Card</option>
        </select>

        <label>Internet Service</label>
        <select name="InternetService">
            <option value="0">DSL</option>
            <option value="1">Fiber Optic</option>
            <option value="2">No</option>
        </select>

        <button type="submit">Predict</button>
    </form>

    {% if prediction_text %}
    <div class="result">
        <h3>{{ prediction_text }}</h3>
        <p>{{ probability_text }}</p>
        <p><strong>{{ strategy_text }}</strong></p>
    </div>
    {% endif %}
</div>

<!-- 🔥 JAVASCRIPT FOR SAMPLE DATA -->
<script>
function fillSampleData() {
    document.getElementsByName("tenure")[0].value = 12;
    document.getElementsByName("MonthlyCharges")[0].value = 70.5;
    document.getElementsByName("TotalCharges")[0].value = 845.5;
    document.getElementsByName("Contract")[0].value = "0";
    document.getElementsByName("PaymentMethod")[0].value = "0";
    document.getElementsByName("InternetService")[0].value = "1";
}
</script>

</body>
</html>
